name: Historical dogfooding evidence readback
on:
  push:
    branches: ['test/ecosystem-discovery-v1']
    paths:
      - 'ecosystem-validation/dogfooding-evidence.json'
      - 'ecosystem-validation/verify-dogfooding.py'
      - '.github/workflows/dogfooding-evidence.yml'
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify public historical evidence without modifying repositories
        run: python3 -B ecosystem-validation/verify-dogfooding.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dogfooding-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dogfooding-verification.json
          if-no-files-found: error
