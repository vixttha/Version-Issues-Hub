name: Six-tool discovery compatibility
on:
  push:
    branches: ['test/ecosystem-discovery-v1']
permissions:
  contents: read
jobs:
  matrix:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: All 64 actual Git branch configurations
        run: python3 ecosystem-validation/discovery.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ecosystem-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ecosystem-discovery.json
          if-no-files-found: error
