name: Six-tool discovery compatibility
on:
  push:
    branches: ['test/ecosystem-discovery-v1']
    paths:
      - 'ecosystem-validation/discovery.py'
      - 'ecosystem-validation/pins.json'
      - '.github/workflows/ecosystem-discovery.yml'
permissions:
  contents: read
jobs:
  matrix:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: All 64 actual Git branch configurations and 192 native smokes
        run: python3 ecosystem-validation/discovery.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ecosystem-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ecosystem-discovery.json
          if-no-files-found: error
