name: VIB disposable installation lifecycle
on:
  push:
    branches: ['test/vib-install-lifecycle']
permissions:
  contents: read
concurrency:
  group: vib-disposable-install-lifecycle
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Actual GitHub install, upgrade, archive and lease-checked removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.lifecycle_trial
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lifecycle-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-lifecycle
          if-no-files-found: error
