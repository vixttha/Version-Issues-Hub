name: Provenistem branch library

on:
  pull_request:
    branches: ["Brand-Identity"]
    paths:
      - 'provenistem/**'
      - '.github/workflows/provenistem-library.yml'
  push:
    branches: ["Brand-Identity"]
    paths:
      - 'provenistem/**'
      - '.github/workflows/provenistem-library.yml'

permissions:
  contents: read

jobs:
  records:
    name: Validate Provenistem records
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Check the branch library
        run: |
          git rev-parse HEAD
          python provenistem/tools/library.py check
          python -m unittest discover -s provenistem/tests -p 'test_*.py' -v
