name: README HQ
on:
  push:
    branches: [readme-hq]
  pull_request:
    branches: [readme-hq]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/check_readme_hq.py
      - run: python3 -m unittest discover -s tests -p 'test_workspace_navigation.py' -v

  graphify:
    name: Rebuild and query the README HQ Graphify maps
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install the pinned Graphify template dependencies
        run: |
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Verify the template and version maps
        run: |
          python -m unittest discover -s graphify-hq/template/v0.0.8 -p 'test_*.py' -v
          git fetch --no-tags --depth=1 https://github.com/vixttha/README-HQ.git $(cat graphify-hq/source-commit.txt)
          python graphify-hq/version_maps.py --check

  presentation:
    name: Verify locked branding and replay README quickstart
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Check exact brand and product source
        run: |
          git fetch --no-tags --depth=1 https://github.com/vixttha/Version-Issues-Hub.git 388c6ef968aa15edf3caa34e9de6819dcda24e7f 114a22196eab578b3053002f8eb7af935b26fe89
          python tools/check_vib_presentation.py
      - name: Replay documented read-only quickstart and verify candidate
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/vixttha/Version-Issues-Hub.git
          cd Version-Issues-Hub
          git checkout --detach 114a22196eab578b3053002f8eb7af935b26fe89
          test "$(git rev-parse HEAD)" = "114a22196eab578b3053002f8eb7af935b26fe89"
          # The installed ledger is mutable, unlike the archived README source.
          # Capture its exact state, replay the documented command, then compare.
          state_sha="$(git ls-remote origin refs/heads/Version-Issues-Hub | cut -f1)"
          test "${#state_sha}" = 40
          git fetch --no-tags --depth=1 origin "$state_sha"
          git show "$state_sha:ledger/handoff.json" > "$RUNNER_TEMP/vib-handoff.json"
          python -m tools.session --target vixttha/Version-Issues-Hub inspect > "$RUNNER_TEMP/vib-inspect.json"
          test "$(git ls-remote origin refs/heads/Version-Issues-Hub | cut -f1)" = "$state_sha"
          python - "$state_sha" <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          observed = json.loads((root / "vib-inspect.json").read_text())
          expected = json.loads((root / "vib-handoff.json").read_text())["active"]
          assert observed["installed_sha"] == sys.argv[1], "Installed revision drift"
          assert observed["owner_merge_required"] is True and observed["evidence_verified"] is False
          assert observed["repository"] == "vixttha/Version-Issues-Hub"
          assert observed["active"] == expected, "Recovered active handoff differs from pinned ledger"
          if expected is None:
              assert observed["status"] == "head_scope_required" and observed["issue"] is None
          else:
              assert observed["status"] == "resume", "Active checkpoint not resumable"
              assert observed["issue"]["number"] == expected["issue"]
              assert observed["issue"]["version"] == expected["version"]
          print(json.dumps(observed, indent=2))
          PY
          python -B -m unittest discover -s tests -v

  live-readme-render:
    name: Actual GitHub README desktop and mobile audit
    if: github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Check browser audit syntax
        run: node --check tools/check_vib_live_render.cjs
      - name: Install exact browser test version
        run: |
          npm install --prefix "$RUNNER_TEMP/vib-browser" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/vib-browser/node_modules/.bin/playwright" install chromium --with-deps
      - name: Inspect actual GitHub-rendered Markdown
        run: NODE_PATH="$RUNNER_TEMP/vib-browser/node_modules" node tools/check_vib_live_render.cjs
      - name: Preserve visual audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vib-readme-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-readme-visual/
          if-no-files-found: warn
          retention-days: 7
