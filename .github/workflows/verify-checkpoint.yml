name: Verify issue checkpoint

on:
  push:
    branches: ['plan/**', main]
  pull_request:
    branches: [main, 'plan/v0.0.0.1']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify generic checkpoint pinned canonical Worker projection
        if: startsWith(github.head_ref, 'plan/checkpoint-') || startsWith(github.ref, 'refs/heads/plan/checkpoint-')
        env:
          CHECKPOINT_BRANCH: ${{ github.head_ref || github.ref_name }}
          VIB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m tools.self_use_preflight --worker-branch "$CHECKPOINT_BRANCH"
      - name: Check the ledger and verify the receipt contract
        run: |
          python tools/checkpoint.py check --previous-ref "$PREVIOUS_SHA"
          python -B -m unittest discover -s tests -v
      - name: Verify recovered self-use projection at pinned canonical Worker state
        if: github.head_ref == 'plan/self-use-recovery-65' || github.ref == 'refs/heads/plan/self-use-recovery-65'
        run: |
          git fetch --no-tags origin 50787c1ca54287dea130c04ff754ab2a1b4f9caf
          python -m tools.self_use_preflight --installed-ref 50787c1ca54287dea130c04ff754ab2a1b4f9caf --issue 65
      - name: Verify #34 pinned canonical Worker projection
        if: github.head_ref == 'plan/optional-hard-gate-34' || github.ref == 'refs/heads/plan/optional-hard-gate-34'
        run: |
          git fetch --no-tags origin 6d1e904a4d24390c560eb0b55a82aff4ae3810cc
          python -m tools.self_use_preflight --installed-ref 6d1e904a4d24390c560eb0b55a82aff4ae3810cc --issue 34
      - name: Write the selected issue verification receipts
        run: python tools/checkpoint.py receipts "$RUNNER_TEMP/issue-receipts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-receipts-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-receipts
          if-no-files-found: error

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Run full Windows regression suite
        run: python -B -m unittest discover -s tests -v

  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vib
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/README-HQ
          ref: 788f2127d3cf004ac5615d21364f5b56e4f7dd31
          path: graphify-kit
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Map VIB issue evidence at the tested checkout
        working-directory: vib
        run: |
          kit=../graphify-kit/graphify-hq/template/v0.0.8
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$kit/requirements.txt"
          python -m pip check
          output="$RUNNER_TEMP/vib-evidence"
          python -m tools.graphify_evidence "$kit/evidence_map.py" "$output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vib-evidence-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-evidence
          if-no-files-found: error
