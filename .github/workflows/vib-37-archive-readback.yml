name: VIB .37 independent retained archive readback
on:
  push:
    branches: [review/vib-53-independent-audit]
    paths: ['.github/workflows/vib-37-archive-readback.yml', 'vib/independent-audit/archive_readback_37.py']
permissions:
  contents: read
jobs:
  readback:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vault
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: '041e187dc1d383082c1a4805e6d4743eec97e535'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: archive
          ref: '0cd6d9fdf59d1f796ebe6b2aedff8f7a3c17d1c1'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Independent digest, graph, native retrieval and historical preservation
        run: python vault/vib/independent-audit/archive_readback_37.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: archive-readback-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-readback.json
          if-no-files-found: error
