name: VIB 77 cumulative Graphify and native retrieval
on:
  push:
    branches: [review/vib-77-code-graphs]
    paths: ['tools/select-cumulative-graphs.py','tools/build-cumulative-graphs.py','tools/audit-inferred-graphs.py','tools/preserve-cumulative-graphs.py','tools/verify-regenerated-graphs.py','tools/test-code-graph-retrieval.py','lib/code-graph.mjs','veraphifiy.mjs','.github/workflows/vib-77-code-graphs.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vault
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '26e9fe8c019a33c5f84f77a37da70925505204e3'
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/Blender-Agent-Refinement-Toolkit
          ref: 6af3c2025be3f51e02dca4e4502088c526aae6d1
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Fetch exact operational source and install pinned Graphify
        run: |
          git -C source fetch --no-tags origin a472e04f4c2cc781c654000d6c0567e703f32791
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r producer/versions/v0.0.8/requirements.txt
          python -m pip check
      - name: Build actual code graphs for all 36 historical source pins
        run: |
          python vault/tools/select-cumulative-graphs.py
          python vault/tools/build-cumulative-graphs.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vib-cumulative-graphs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-cumulative-graphs
          if-no-files-found: error
  preserve:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Download and verify raw graph artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "vib-cumulative-graphs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/graphs"
          if [ -d archives/cumulative-code-graphs ]; then
            python3 tools/verify-regenerated-graphs.py
            python3 tools/test-code-graph-retrieval.py
          else
            python3 tools/preserve-cumulative-graphs.py
          fi
      - name: Preserve version directories on review branch only
        run: |
          if git ls-files --error-unmatch archives/cumulative-code-graphs/index.json >/dev/null 2>&1; then
            echo 'Existing immutable archive verified; no write.'
            exit 0
          fi
          git add archives/cumulative-code-graphs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Preserve 36 cumulative Graphify code graphs and source audit"
          git push origin HEAD:refs/heads/review/vib-77-code-graphs
