name: Retained VIB code graph qualification
on:
  push:
    branches: [review/vib-77-code-graphs, Veraphify]
    paths: ['tools/verify-retained-code-graphs.py', 'tools/test-code-graph-retrieval.py', 'tools/audit-inferred-graphs.py', 'tools/test-inferred-scopes.py', '.gitattributes', '.github/workflows/vib-77-retained.yml', 'archives/code-graphs/**', 'archives/cumulative-code-graphs/**', 'lib/code-graph.mjs', 'veraphifiy.mjs']
  pull_request:
    branches: [Veraphify]
    paths: ['tools/verify-retained-code-graphs.py', 'tools/test-code-graph-retrieval.py', 'tools/audit-inferred-graphs.py', 'tools/test-inferred-scopes.py', '.gitattributes', '.github/workflows/vib-77-retained.yml', 'archives/code-graphs/**', 'archives/cumulative-code-graphs/**', 'lib/code-graph.mjs', 'veraphifiy.mjs']
permissions:
  contents: read
jobs:
  retained:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Test lexical scope regressions
        run: python tools/test-inferred-scopes.py
      - name: Verify all retained code graphs and audit inferred edges
        run: python tools/verify-retained-code-graphs.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: retained-code-graphs-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-graph-audit
          if-no-files-found: error
