name: VIB exact-pin ecosystem audit
on:
  push:
    branches: [audit/vib-final-ecosystem-20261124]
permissions:
  contents: read
jobs:
  independent:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: readme
            pin: a9cdd97c4ad111ed4bb3eb1efa4c9bafc306a9b4
          - tool: brand
            pin: 388c6ef968aa15edf3caa34e9de6819dcda24e7f
          - tool: lydite
            pin: 610f4f52ded26ee8c3a8d958bd01358efa2f472a
          - tool: provenistem
            pin: be2b4224dade8dc297f5be59b7e94847f5e2e75e
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TOOL: ${{ matrix.tool }}
      PIN: ${{ matrix.pin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.pin }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify exact independent installed checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIN"
          case "$TOOL" in
            readme)
              python tools/check_readme_hq.py
              python -B -m unittest discover -s tests -p test_workspace_navigation.py -v
              ;;
            brand)
              python brand-identity/verify.py --ready-for-artwork
              python -B -m unittest discover -s brand-identity -p 'test_*.py' -v
              python brand-identity/08-review/verify_lock.py
              ;;
            lydite)
              python tools/inventory.py
              python -B -m unittest discover -s tools -p test_inventory.py -v
              ;;
            provenistem)
              python tools/library.py check
              ;;
          esac
          test -z "$(git status --porcelain)"
  veraphify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VIB_SOURCE: '896ce5576974e0881ac9438b4200347aa79018a8'
      PRODUCER_SHA: '6af3c2025be3f51e02dca4e4502088c526aae6d1'
      GRAPHIFY_QUERY_LOG_DISABLE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: veraphify
          ref: 36cdaaa87c900b56072a24f7081aa0f92dc56f2c
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vib
          ref: '896ce5576974e0881ac9438b4200347aa79018a8'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: vixttha/Blender-Agent-Refinement-Toolkit
          ref: '6af3c2025be3f51e02dca4e4502088c526aae6d1'
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r producer/versions/v0.0.8/requirements.txt
          python -m pip check
          python veraphify/tools/verify-vib-candidate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vib-ecosystem-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-candidate-archive
          if-no-files-found: error
