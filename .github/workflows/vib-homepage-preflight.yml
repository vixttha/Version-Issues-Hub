name: VIB unpublished homepage preflight
on:
  push:
    branches: [review/vib-homepage-preflight]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify derivative and preserved archive
        run: |
          python tools/check_readme_hq.py
          python -m unittest discover -s tests -p 'test_workspace_navigation.py' -v
          git fetch --no-tags --depth=1 origin 265e0e4724bc409b16d2605fc4d59d2f3f658eaf
          python - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('workspace/v0.0.2')
          before = 'a9cdd97c4ad111ed4bb3eb1efa4c9bafc306a9b4'
          core = '265e0e4724bc409b16d2605fc4d59d2f3f658eaf'
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD:workspace/v0.0.1/accepted/README.md') == '737edc9734a5dd5aab2f9f87b4a1eaadacb9376b'
          assert git('diff', '--name-only', before, 'HEAD', '--', 'workspace/v0.0.1') == ''
          for name, sha in [('vib-logo.svg','3bf0564bc56d57159a6d1baf4d5baa9b4b5b3893'),('vib-logo-light.svg','df709a42fee10fcfada6747298dcda18f1465731')]:
              assert git('rev-parse', f'HEAD:workspace/v0.0.2/assets/{name}') == sha
          text = (root/'DRAFT.md').read_text()
          original = git('show', core+':README.md')
          marker = original[original.index('<!-- agent-capability:v1'):original.index('-->', original.index('<!-- agent-capability:v1'))+3]
          assert text.count(marker) == 1
          assert core in text and 'f4be1d5261fb82c4c79764672aa0fb6dc3b5b356' in text and 'not approved for publication' in text
          assert '91 regression tests' in text and '95 tests' in text
          assert '114a22196eab578b3053002f8eb7af935b26fe89' not in text
          print('Accepted archive, locked logo blobs, discovery marker and review-only pin verified')
          PY
      - name: Replay exact read-only quickstart
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/vixttha/Version-Issues-Hub.git vib-preflight
          cd vib-preflight
          git checkout --detach 265e0e4724bc409b16d2605fc4d59d2f3f658eaf
          python -m tools.session --target vixttha/Version-Issues-Hub inspect > "$RUNNER_TEMP/vib-inspect.json"
          python -c 'import json,os; from pathlib import Path; x=json.loads((Path(os.environ["RUNNER_TEMP"])/"vib-inspect.json").read_text()); assert x["status"]=="head_scope_required" and x["active"] is None and x["owner_merge_required"] is True and x["evidence_verified"] is False; print(json.dumps(x,indent=2))'
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node --check tools/check_vib_homepage_preflight.cjs
      - run: |
          npm install --prefix "$RUNNER_TEMP/vib-browser" --no-audit --no-fund --save-exact playwright@1.56.1
          "$RUNNER_TEMP/vib-browser/node_modules/.bin/playwright" install chromium --with-deps
      - run: NODE_PATH="$RUNNER_TEMP/vib-browser/node_modules" node tools/check_vib_homepage_preflight.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vib-homepage-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vib-readme-visual/
          if-no-files-found: warn
          retention-days: 7
