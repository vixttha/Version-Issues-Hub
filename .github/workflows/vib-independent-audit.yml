name: VIB independent .37 and historical relationship audit
on:
  push:
    branches: [review/vib-53-independent-audit]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vault
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'e8359a4acaf2e956332585aa69a109e3242dad50'
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '3841de9bb17a10a9ce579fc2cf2ac7111e524fac'
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Fetch exact historical Git objects
        run: git -C archive fetch --no-tags origin 26e9fe8c019a33c5f84f77a37da70925505204e3 a472e04f4c2cc781c654000d6c0567e703f32791
      - name: Reproduce RD-002 and independently exercise recovery controls
        run: python vault/vib/independent-audit/test_recovery.py
      - name: Audit 72 historical code graphs and high-impact relationships
        if: always()
        run: python vault/vib/independent-audit/audit_history.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-vib-audit-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-vib-audit
          if-no-files-found: error
