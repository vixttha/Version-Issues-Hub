name: VIB independent .37 and historical relationship audit
on:
  push:
    branches: [review/vib-53-independent-audit]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'vixttha/Version-Issues-Hub' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: vault
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'b68796db12681fe4d43b562c8647deca38fa819c'
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9c743093dc641dc85e006858f14f7f0a1c73f8a3'
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Fetch exact historical Git objects
        run: git -C archive fetch --no-tags origin 26e9fe8c019a33c5f84f77a37da70925505204e3 a472e04f4c2cc781c654000d6c0567e703f32791
      - name: Audit API boundaries
        run: python vault/vib/independent-audit/api_boundaries.py
      - name: Historical and inferred relationship audit
        run: python vault/vib/independent-audit/deep_history.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Verify exact candidate Graphify archive
        run: python vault/vib/independent-audit/candidate_graph.py
      - name: Bash independent Git and artifact checks
        shell: bash
        run: bash vault/vib/independent-audit/audit.sh
      - name: PowerShell independent evidence controls
        shell: pwsh
        run: ./vault/vib/independent-audit/audit.ps1
      - name: Confirm outstanding RD-002 and RD-003 on pinned candidate
        run: python vault/vib/independent-audit/followup.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-vib-audit-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-vib-audit
          if-no-files-found: error
