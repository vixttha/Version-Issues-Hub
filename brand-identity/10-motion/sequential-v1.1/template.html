<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:960px;height:720px;background:transparent;overflow:hidden}#root{position:relative;width:960px;height:720px;background:transparent}#root>svg{display:block;width:100%;height:100%}.activation-layer{position:absolute;inset:0;pointer-events:none}</style>
<script src="./gsap.min.js"></script></head><body>
<div id="root" data-composition-id="sequential" data-width="960" data-height="720" data-start="0" data-duration="6">
<!-- APPROVED SVG -->
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true, defaults:{lazy:false}});
[0.4,1.45,2.5].forEach((start,i)=>{
 const selector="#activation-"+i;
 tl.fromTo(selector,{autoAlpha:0},{autoAlpha:1,duration:0.2,ease:"power1.inOut",immediateRender:false},start)
   .fromTo(selector,{autoAlpha:1},{autoAlpha:0,duration:0.25,ease:"power1.inOut",immediateRender:false},start+0.8)
   .set(selector,{autoAlpha:0},start+1.05);
});
tl.to({}, {duration: 2.45}, 3.55);
window.__timelines.sequential = tl;
</script></body></html>
