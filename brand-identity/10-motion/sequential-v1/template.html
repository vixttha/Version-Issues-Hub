<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:960px;height:720px;background:transparent;overflow:hidden}#root{position:relative;width:960px;height:720px;background:transparent}#root>svg{display:block;width:100%;height:100%}</style>
<script src="./gsap.min.js"></script></head><body>
<div id="root" data-composition-id="sequential" data-width="960" data-height="720" data-start="0" data-duration="6">
<!-- APPROVED SVG -->
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
[0.5,1.4,2.3].forEach((start,i)=>{
 const selector="#activation-"+i;
 tl.to(selector,{opacity:1,duration:0.25,ease:"power1.inOut"},start)
   .to(selector,{opacity:0,duration:0.25,ease:"power1.inOut"},start+0.65);
});
tl.to({}, {duration: 2.8}, 3.2);
window.__timelines.sequential = tl;
</script></body></html>
