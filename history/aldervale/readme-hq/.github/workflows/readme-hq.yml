name: README HQ validation

on:
  push:
    branches: [readme-hq]
  pull_request:
    branches: [readme-hq]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-hq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    if: github.event.repository.private == false
    name: Version archives and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check archives, current-main links, and external URLs
        run: python3 tools/check_readme_hq.py
